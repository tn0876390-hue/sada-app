name: Build SADA APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create base project
        run: |
          flutter create temp_build
          cp pubspec.yaml temp_build/
          cp lib/main.dart temp_build/lib/ || echo "main.dart not found"
          # Fix minSdk for Jitsi
          sed -i 's/minSdkVersion 21/minSdkVersion 24/g' temp_build/android/app/build.gradle
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' temp_build/android/app/build.gradle
          sed -i 's/minSdk 21/minSdk 24/g' temp_build/android/app/build.gradle
          sed -i 's/compileSdkVersion 34/compileSdkVersion 34/g' temp_build/android/app/build.gradle
          cd temp_build
          flutter pub get
          flutter doctor

      - name: Build APK
        run: |
          cd temp_build
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sada-apk
          path: temp_build/build/app/outputs/flutter-apk/app-release.apk
