name: Build SADA APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Rebuild Android
        run: |
          rm -rf android
          flutter create. --platforms=android --org com.sada.app --project-name sada
          flutter pub get

      - name: Patch minSdk 24
        run: |
          sed -i 's/minSdkVersion 21/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdk 21/minSdk 24/g' android/app/build.gradle
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g' android/app/build.gradle
          sed -i 's/minSdk 23/minSdk 24/g' android/app/build.gradle
          cat android/app/build.gradle | grep -A1 minSdk

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sada-apk
          path: build/app/outputs/flutter-apk/app-release.apk
