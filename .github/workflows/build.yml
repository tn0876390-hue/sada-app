name: Build SADA APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Rebuild Android Folder
        run: |
          rm -rf android
          flutter create. --platforms=android --project-name sada --org com.sada.app
          flutter pub get

      - name: Force minSdk 24 for Jitsi
        run: |
          echo "Patching to 24..."
          # لكل انواع الملفات
          find android -name "build.gradle" -o -name "build.gradle.kts" | xargs -I {} sh -c 'echo "Patching {}"; sed -i "s/minSdkVersion 21/minSdkVersion 24/g" {}; sed -i "s/minSdk 21/minSdk 24/g" {}; sed -i "s/minSdkVersion 23/minSdkVersion 24/g" {}; sed -i "s/minSdk 23/minSdk 24/g" {}; sed -i "s/compileSdk 33/compileSdk 34/g" {}; sed -i "s/compileSdkVersion 33/compileSdkVersion 34/g" {}; sed -i "s/compileSdk 31/compileSdk 34/g" {}'

          echo "=== RESULT ==="
          grep -r "minSdk" android/app/build.gradle* || grep -r "minSdk" android/app/src -n || cat android/app/build.gradle | grep minSdk
          grep -r "compileSdk" android/app/build.gradle* | head -n 5

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sada-apk
          path: build/app/outputs/flutter-apk/app-release.apk
